version: 1.0.0
baseline: 2026-07-13
semantics:
  membership: "Cada feature possui exatamente um marco primário; trabalho preparatório não altera essa associação."
  promotion: "Todos os critérios e todas as evidências bloqueantes do marco devem estar PASS; ausência equivale a FAIL."
  history: "A promoção registra ruleset, seeds, commit e instante observado e nunca reescreve uma promoção anterior."

milestones:
  - id: M0
    name: Fundação executável
    outcome: "Kernel, gênese, relógio e scheduler reproduzíveis com snapshots versionados."
    featureIds:
      - FND-001
    entryConditions:
      - "Baseline técnica ratificada e workspace Node.js 22/PNPM 10 disponível."
      - "Fonte do domínio, shared kernel e simulator CLI presentes no monorepo."
    exitCriteria:
      - id: M0-EC-01
        condition: "IDs tipados, data lógica, ruleset, Result/erros e eventos possuem contratos estáveis."
      - id: M0-EC-02
        condition: "PCG32 reproduz o golden vector e o mesmo seed/ruleset produz o mesmo estado."
      - id: M0-EC-03
        condition: "Um mundo pode ser criado, receber gênese, ser ativado e avançar dias pelo CLI."
      - id: M0-EC-04
        condition: "Snapshots possuem versão, escrita atômica e leitura compatível com versões suportadas."
      - id: M0-EC-05
        condition: "Scheduler prova ordenação determinística, lease/fencing, retry, cancelamento e idempotência."
      - id: M0-EC-06
        condition: "Gates locais de formato, lint, tipos, testes e build terminam com código zero."
    requiredEvidence:
      - {
          slotId: M0-TEST-WORKSPACE,
          type: TEST,
          proves: [M0-EC-01, M0-EC-02, M0-EC-04, M0-EC-05],
        }
      - { slotId: M0-BUILD-WORKSPACE, type: BUILD, proves: [M0-EC-06] }
      - {
          slotId: M0-TRACE-CLI,
          type: TRACE,
          proves: [M0-EC-03],
          requires: [rulesetVersion, seedSet],
        }
      - { slotId: M0-REVIEW-SNAPSHOT-COMPAT, type: REVIEW, proves: [M0-EC-04] }
    nextMilestoneCondition: "Todos os slots M0 estão PASS e o contrato da fundação foi congelado."

  - id: M1
    name: Temporada headless
    outcome: "O universo disputa, encerra e reinicia temporadas completas e calibráveis sem cliente."
    featureIds:
      - BC-002
      - BC-003
      - BC-004
      - BC-005
      - BC-006
      - BC-007
      - BC-008
      - BC-009
      - X-001
      - VAL-001
    entryConditions:
      - "M0 promovido e seus contratos públicos congelados."
      - "Ownership de Mundo, Clube, Jogador, Staff, Mercado, Competição, Partida e Economia declarado."
      - "A fatia de contratos/eventos/sagas de X-002 necessária ao headless está congelada."
    exitCriteria:
      - id: M1-EC-01
        condition: "Um mundo executa ao menos 20 temporadas, incluindo homologação e rollover, sem corrupção de estado."
      - id: M1-EC-02
        condition: "O mesmo seed, ruleset e stream de comandos reproduz hashes idênticos em simulação e replay."
      - id: M1-EC-03
        condition: "Competições, classificação, elegibilidade, lifecycle, demografia e contratos permanecem íntegros."
      - id: M1-EC-04
        condition: "Ledger conserva valor, registra faucets/sinks e fecha com residual zero."
      - id: M1-EC-05
        condition: "Partida automática, live, offline, lote e replay usam um único kernel autoritativo."
      - id: M1-EC-06
        condition: "IA usa os mesmos commands e informações permitidos ao gestor e gera explicação reproduzível."
      - id: M1-EC-07
        condition: "Lotes R-34/R-88 e extensões longas atendem INV, BS, BE e BD aplicáveis."
      - id: M1-EC-08
        condition: "Todos os critérios aplicáveis de G1–G7 estão PASS para o ruleset candidato."
    requiredEvidence:
      - {
          slotId: M1-TEST-INVARIANTS,
          type: TEST,
          proves: [M1-EC-03, M1-EC-04, M1-EC-05],
        }
      - {
          slotId: M1-REPORT-20-SEASONS,
          type: REPORT,
          proves: [M1-EC-01, M1-EC-03, M1-EC-04],
          requires: [rulesetVersion, seedSet],
        }
      - {
          slotId: M1-TRACE-GOLDEN-REPLAY,
          type: TRACE,
          proves: [M1-EC-02, M1-EC-05],
          requires: [rulesetVersion, seedSet],
        }
      - {
          slotId: M1-REPORT-AI-EXPLANATIONS,
          type: REPORT,
          proves: [M1-EC-06],
          requires: [rulesetVersion, seedSet],
        }
      - {
          slotId: M1-REPORT-R34-R88,
          type: REPORT,
          proves: [M1-EC-07],
          requires: [rulesetVersion, seedSet],
        }
      - {
          slotId: M1-REVIEW-G1-G7,
          type: REVIEW,
          proves: [M1-EC-08],
          requires: [rulesetVersion],
        }
    nextMilestoneCondition: "M1 está integralmente PASS e os contracts de domínio/eventos consumidos pelo backend foram congelados."

  - id: M2
    name: Backend multiplayer
    outcome: "Persistência, integrações duráveis e operação autoritativa fecham os fluxos sem depender dos clientes."
    featureIds:
      - X-002
      - BC-001
      - BC-010
      - BC-011
      - BC-012
    entryConditions:
      - "M1 promovido para um ruleset candidato reproduzível."
      - "Commands, queries, eventos, erros e ownership dos contextos headless estão congelados."
      - "Estratégia expand-contract, isolamento por mundo e constraints físicas foram revisados."
    exitCriteria:
      - id: M2-EC-01
        condition: "PostgreSQL é a fonte autoritativa, com migrations reversíveis/compatíveis e constraints de integridade."
      - id: M2-EC-02
        condition: "Outbox/Inbox/DLQ, ordering, replay e projeções provam entrega at-least-once sem efeitos duplicados."
      - id: M2-EC-03
        condition: "Sagas de onboarding, mercado, rollover, infraestrutura e saída retomam de checkpoints e compensam falhas."
      - id: M2-EC-04
        condition: "Conta, sessão, participação e controle de clube resistem a concorrência, cooldown e duplicidade."
      - id: M2-EC-05
        condition: "Narrativa, notificações, relatórios e memória são reconstruíveis a partir de fatos oficiais."
      - id: M2-EC-06
        condition: "Anti-abuso, correções, sanções, recursos, suporte e reprocesso preservam trilha de auditoria."
      - id: M2-EC-07
        condition: "Os 16 golden paths possuem cenário headless/contratual executável até a fronteira de cliente."
    requiredEvidence:
      - { slotId: M2-MIGRATION-DATABASE, type: MIGRATION, proves: [M2-EC-01] }
      - { slotId: M2-TEST-EVENTING, type: TEST, proves: [M2-EC-02] }
      - {
          slotId: M2-TRACE-SAGA-RECOVERY,
          type: TRACE,
          proves: [M2-EC-03],
          requires: [rulesetVersion, seedSet],
        }
      - { slotId: M2-TEST-IDENTITY-CONCURRENCY, type: TEST, proves: [M2-EC-04] }
      - { slotId: M2-TEST-REBUILD-PROJECTIONS, type: TEST, proves: [M2-EC-05] }
      - {
          slotId: M2-SECURITY-ADMIN-AUDIT,
          type: SECURITY_TEST,
          proves: [M2-EC-06],
        }
      - {
          slotId: M2-REPORT-GOLDEN-PATH-CONTRACTS,
          type: REPORT,
          proves: [M2-EC-07],
        }
    nextMilestoneCondition: "M2 está PASS e contratos comuns de cliente, sequência realtime e política offline foram congelados."

  - id: M3
    name: MVP jogável
    outcome: "Mobile e admin concluem os 16 golden paths sobre contratos oficiais e não autoritativos."
    featureIds:
      - X-003
      - GP-001
      - GP-002
      - GP-003
      - GP-004
      - GP-005
      - GP-006
      - GP-007
      - GP-008
      - GP-009
      - GP-010
      - GP-011
      - GP-012
      - GP-013
      - GP-014
      - GP-015
      - GP-016
    entryConditions:
      - "M2 promovido e APIs/contratos comuns versionados e congelados."
      - "Design system, matriz de 138 telas e critérios de acessibilidade rastreados."
      - "Whitelist offline e protocolo de recuperação de duplicata/gap aprovados."
    exitCriteria:
      - id: M3-EC-01
        condition: "GP-001…GP-016 passam ponta a ponta nos clientes contra o backend autoritativo."
      - id: M3-EC-02
        condition: "Clientes não calculam nem persistem estado oficial e ações irreversíveis não entram na fila offline."
      - id: M3-EC-03
        condition: "Realtime detecta duplicatas e gaps, recupera snapshot/projeção e retoma a sequência."
      - id: M3-EC-04
        condition: "Telas aplicáveis cobrem loading, empty, error, blocked, offline e recuperação."
      - id: M3-EC-05
        condition: "Fluxos críticos passam critérios de acessibilidade em mobile e admin."
      - id: M3-EC-06
        condition: "Builds reproduzíveis dos clientes e backend são produzidos para a release candidata."
    requiredEvidence:
      - {
          slotId: M3-TEST-GP-E2E,
          type: TEST,
          proves: [M3-EC-01],
          requires: [rulesetVersion, seedSet],
        }
      - {
          slotId: M3-REVIEW-NON-AUTHORITATIVE,
          type: REVIEW,
          proves: [M3-EC-02],
        }
      - { slotId: M3-TRACE-REALTIME-RECOVERY, type: TRACE, proves: [M3-EC-03] }
      - { slotId: M3-REPORT-SCREEN-STATES, type: REPORT, proves: [M3-EC-04] }
      - { slotId: M3-TEST-ACCESSIBILITY, type: TEST, proves: [M3-EC-05] }
      - { slotId: M3-BUILD-RELEASE, type: BUILD, proves: [M3-EC-06] }
    nextMilestoneCondition: "M3 está PASS e a release candidata foi congelada para carga, segurança e gameday."

  - id: M4
    name: Produção
    outcome: "Release segura, observável, recuperável e promovida com G1–G8 simultaneamente verdes."
    featureIds:
      - OPS-001
    entryConditions:
      - "M3 promovido e release/ruleset candidatos imutáveis durante a validação."
      - "SLOs, RPO/RTO, capacidade, privacidade, backup, rollback e runbooks aprovados como critérios."
      - "Ambiente de carga e restore isolado representa a topologia de produção."
    exitCriteria:
      - id: M4-EC-01
        condition: "G1–G8 estão simultaneamente PASS para a mesma release e ruleset."
      - id: M4-EC-02
        condition: "Carga e soak atendem SLOs e limites de capacidade sem violar isolamento ou integridade."
      - id: M4-EC-03
        condition: "Testes de segurança e privacidade não possuem achado bloqueante aberto."
      - id: M4-EC-04
        condition: "Restore isolado e exercício regional medem RPO/RTO dentro dos objetivos aprovados."
      - id: M4-EC-05
        condition: "Deploy, rollback, observabilidade, alertas e runbooks são exercitados em gameday."
      - id: M4-EC-06
        condition: "A decisão go/no-go referencia todas as evidências, owners e exceções com prazo."
    requiredEvidence:
      - {
          slotId: M4-REVIEW-G1-G8,
          type: REVIEW,
          proves: [M4-EC-01],
          requires: [rulesetVersion],
        }
      - {
          slotId: M4-LOAD-SOAK,
          type: LOAD_TEST,
          proves: [M4-EC-02],
          requires: [rulesetVersion, seedSet],
        }
      - { slotId: M4-SECURITY-PRIVACY, type: SECURITY_TEST, proves: [M4-EC-03] }
      - { slotId: M4-GAMEDAY-RESTORE-DR, type: GAMEDAY, proves: [M4-EC-04] }
      - {
          slotId: M4-GAMEDAY-DEPLOY-ROLLBACK,
          type: GAMEDAY,
          proves: [M4-EC-05],
        }
      - { slotId: M4-REPORT-GO-NO-GO, type: REPORT, proves: [M4-EC-06] }
    nextMilestoneCondition: "Não há marco posterior; PASS autoriza promoção, FAIL ou ausência mantém NO-GO."
